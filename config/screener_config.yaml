# =============================================================================
# Nifty 100 Screener Configuration
# =============================================================================
# Each preset defines named threshold filters over the 15 filterable metrics.
# Missing metrics mean "no constraint" (i.e. don't filter on that metric).
#
# Financial-sector companies (banks/NBFCs/insurance) are AUTOMATICALLY
# excluded from any D/E filter (per spec: high leverage is structural).
# Debt-free companies (icr_label == "Debt Free") always PASS any ICR-min
# filter because they have infinite interest cover.
#
# All results are sorted by composite_quality_score descending.
# =============================================================================

defaults:
  sort_by: composite_quality_score
  sort_ascending: false
  exclude_financials_from_de_filter: true
  debt_free_passes_icr: true
  latest_year_only: true

# ---------------------------------------------------------------------------
# 6 Preset Filters
# ---------------------------------------------------------------------------
presets:

  quality_compounders:
    label: "Quality Compounders"
    description: >
      High ROE, low leverage, consistent growth — the classic Buffett-style
      quality screen. Companies that compound book value at >15% with
      strong free cash flow and minimal debt.
    filters:
      min_roe_pct: 15
      max_debt_to_equity: 1.0
      min_revenue_cagr_5yr_pct: 8
      min_pat_cagr_5yr_pct: 8
      min_opm_pct: 15
      min_icr: 3.0
      min_fcf_cr: 0
      min_cfo_pat_ratio: 0.8

  dividend_aristocrats:
    label: "Dividend Aristocrats"
    description: >
      Large-cap profitable companies paying healthy dividends with
      adequate interest cover and low leverage. Suitable for income
      portfolios.
    filters:
      min_dividend_yield_pct: 2.0
      min_roe_pct: 12
      max_debt_to_equity: 1.5
      min_icr: 2.5
      min_market_cap_cr: 20000
      min_net_profit_cr: 1000
      min_pat_cagr_5yr_pct: 5

  growth_at_reasonable_price:
    label: "Growth At Reasonable Price (GARP)"
    description: >
      High earnings growth without paying exorbitant valuations. Balances
      top-line and EPS momentum with P/E and P/B ceilings.
    filters:
      min_revenue_cagr_5yr_pct: 12
      min_pat_cagr_5yr_pct: 12
      min_eps_cagr_5yr_pct: 10
      max_pe_ratio: 30
      max_pb_ratio: 8
      min_roe_pct: 15
      min_opm_pct: 12

  deep_value:
    label: "Deep Value"
    description: >
      Statistically cheap on P/E and P/B with acceptable profitability
      and interest coverage — classic Graham/Buffett cigar-butt screen.
    filters:
      max_pe_ratio: 15
      max_pb_ratio: 3
      min_roe_pct: 10
      min_opm_pct: 8
      min_icr: 1.5
      min_net_profit_cr: 500

  debt_free:
    label: "Zero-Debt Quality"
    description: >
      Companies with zero or negligible borrowings, high interest cover
      (debt-free always passes), strong ROE, and healthy cash generation.
      Conservative, low-bankruptcy-risk screen.
    filters:
      max_debt_to_equity: 0.1
      min_roe_pct: 15
      min_fcf_cr: 100
      min_asset_turnover: 0.5
      min_cfo_pat_ratio: 0.9

  small_cap_momentum:
    label: "Mid/Small-Cap Growth Momentum"
    description: >
      Faster-growing companies under the large-cap threshold with strong
      revenue and EPS momentum and operating leverage. Higher risk,
      higher reward.
    filters:
      min_revenue_cagr_5yr_pct: 15
      min_eps_cagr_5yr_pct: 12
      min_opm_pct: 10
      max_market_cap_cr: 100000
      min_sales_cr: 2000
      min_asset_turnover: 0.6

# ---------------------------------------------------------------------------
# Sector Aliases (which broad_sector values are treated as "Financials" for
# the D/E filter auto-skip and for ROA-proxy ROCE handling).
# ---------------------------------------------------------------------------
financial_sector_keywords:
  - bank
  - nbfc
  - finance
  - financial
  - insurance

# ---------------------------------------------------------------------------
# Column mapping: logical filter name -> SQL expression/alias on the joined
# dataset (must match the AS aliases in SCREENER_SQL).
# *_min filters keep rows >= threshold; *_max keep rows <= threshold.
# ---------------------------------------------------------------------------
metrics:
  roe_pct:
    column: roe_pct
    direction: min
  debt_to_equity:
    column: debt_to_equity
    direction: max
    skip_financials: true
  fcf_cr:
    column: fcf_cr
    direction: min
  revenue_cagr_5yr_pct:
    column: revenue_cagr_5yr
    direction: min
  pat_cagr_5yr_pct:
    column: pat_cagr_5yr
    direction: min
  eps_cagr_5yr_pct:
    column: eps_cagr_5yr
    direction: min
  opm_pct:
    column: operating_profit_margin_pct
    direction: min
  pe_ratio:
    column: pe_ratio
    direction: max
  pb_ratio:
    column: pb_ratio
    direction: max
  dividend_yield_pct:
    column: dividend_yield_pct
    direction: min
  icr:
    column: icr
    direction: min
    debt_free_passes: true
  market_cap_cr:
    column: market_cap_cr
    direction: min
  net_profit_cr:
    column: net_profit
    direction: min
  asset_turnover:
    column: asset_turnover
    direction: min
  sales_cr:
    column: sales
    direction: min
  cfo_pat_ratio:
    column: cfo_pat_ratio
    direction: min
