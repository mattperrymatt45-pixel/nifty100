# =============================================================================
# Nifty 100 Screener Configuration  (v2 — Sprint 3 Day 16)
# =============================================================================
# Preset names, thresholds, and ranking metrics follow spec §25 exactly:
#   Quality Compounder, Value Pick, Growth Accelerator, Dividend Champion,
#   Debt-Free Blue Chip, Turnaround Watch.
#
# Filter directions:
#   min  - column >= threshold              (NaN fails)
#   max  - column <= threshold              (NaN fails)
#   eq   - column ≈ threshold (within eq_epsilon; default 0.05)
#   flag - column is truthy (True or > 0)   (NaN fails)
#
# Special flags:
#   skip_financials: true  -> companies in Financials sector auto-pass (high
#                             leverage is structural for banks/NBFCs/insurance)
#   debt_free_passes: true -> companies with icr_label == "Debt Free" auto-pass
#                             (infinite cover / zero leverage)
#   eq_epsilon            -> tolerance for 'eq' direction (e.g. D/E <= 0.05 is
#                             treated as effectively zero-leverage)
# =============================================================================

defaults:
  sort_by: composite_quality_score
  sort_ascending: false
  exclude_financials_from_de_filter: true
  debt_free_passes_icr: true
  latest_year_only: true

# ---------------------------------------------------------------------------
# 6 Preset Screens  (spec §25 — Day 16)
# ---------------------------------------------------------------------------
presets:

  quality_compounder:
    label: "Quality Compounder"
    description: >
      Classic Buffett-style quality screen: high ROE with low leverage,
      positive free cash flow, and double-digit revenue growth. Per spec §25:
      ROE > 15%, D/E < 1.0, FCF > 0, Revenue CAGR 5yr > 10%.
    filters:
      min_roe_pct: 15
      max_debt_to_equity: 1.0
      flag_fcf_positive: true
      min_revenue_cagr_5yr_pct: 10

  value_pick:
    label: "Value Pick"
    description: >
      Statistically cheap on classic valuation multiples with reasonable
      leverage and a dividend cushion. Per spec §25: P/E < 20, P/B < 3.0,
      D/E < 2.0, Dividend Yield > 1%.
    filters:
      max_pe_ratio: 20
      max_pb_ratio: 3.0
      max_debt_to_equity: 2.0
      min_dividend_yield_pct: 1.0

  growth_accelerator:
    label: "Growth Accelerator"
    description: >
      High-growth companies with strong profit and revenue momentum and
      manageable leverage. Per spec §25: PAT CAGR 5yr > 20%, Revenue CAGR
      5yr > 15%, D/E < 2.0.
    filters:
      min_pat_cagr_5yr_pct: 20
      min_revenue_cagr_5yr_pct: 15
      max_debt_to_equity: 2.0

  dividend_champion:
    label: "Dividend Champion"
    description: >
      Mature dividend payers with sustainable payouts, positive free cash
      flow to back the dividend, and healthy yield. Per spec §25: Dividend
      Yield > 2%, Dividend Payout < 80%, FCF > 0.
    filters:
      min_dividend_yield_pct: 2.0
      max_dividend_payout_ratio_pct: 80
      flag_fcf_positive: true

  debt_free_blue_chip:
    label: "Debt-Free Blue Chip"
    description: >
      Conservatively financed large-caps with negligible debt and solid
      profitability. Per spec §25: D/E = 0, ROE > 12%, Revenue > 5,000 Cr.
      A 0.20 epsilon is applied (D/E ≤ 0.20 treated as effectively debt-free
      — real-world convention for "debt-light blue chips" since exact-zero
      leverage is uncommon) and debt-free-labelled companies auto-pass.
    filters:
      eq_debt_to_equity_zero: true
      min_roe_pct: 12
      min_sales_cr: 5000

  turnaround_watch:
    label: "Turnaround Watch"
    description: >
      Companies showing early signs of operational improvement: revenue
      re-acceleration over 3 years, free cash flow turned positive, and
      leverage declining year-over-year (deleveraging). Per spec §25:
      Revenue CAGR 3yr > 10%, FCF positive in latest year, D/E declining YoY.
    filters:
      min_revenue_cagr_3yr_pct: 10
      flag_fcf_positive: true
      flag_de_yoy_declining: true

# ---------------------------------------------------------------------------
# Sector Aliases (which broad_sector values are treated as "Financials" for
# the D/E filter auto-skip and for ROA-proxy ROCE handling).
# ---------------------------------------------------------------------------
financial_sector_keywords:
  - bank
  - nbfc
  - finance
  - financial
  - insurance

# ---------------------------------------------------------------------------
# Column mapping: logical filter name -> SQL expression/alias on the joined
# dataset (must match the AS aliases in SCREENER_SQL).
# *_min filters keep rows >= threshold; *_max keep rows <= threshold.
# *_eq filters require column ≈ threshold (within eq_epsilon).
# *_flag filters require boolean True / numeric > 0.
#
# Special "virtual" keys (eq_debt_to_equity_zero, flag_*, etc.) declared in
# the presets map onto their real metric entry by stripping the direction
# prefix in load_config() — see engine.load_config for the canonicalisation.
# ---------------------------------------------------------------------------
metrics:
  roe_pct:
    column: roe_pct
    direction: min
  debt_to_equity:
    column: debt_to_equity
    direction: max
    skip_financials: true
    debt_free_passes: true
  debt_to_equity_zero:
    column: debt_to_equity
    direction: eq
    skip_financials: false  # banks/insurers are structurally leveraged — do NOT skip
    debt_free_passes: true
    eq_epsilon: 0.20
  fcf_cr:
    column: fcf_cr
    direction: min
  fcf_positive:
    column: fcf_positive
    direction: flag
  revenue_cagr_5yr_pct:
    column: revenue_cagr_5yr
    direction: min
  revenue_cagr_3yr_pct:
    column: revenue_cagr_3yr
    direction: min
  pat_cagr_5yr_pct:
    column: pat_cagr_5yr
    direction: min
  eps_cagr_5yr_pct:
    column: eps_cagr_5yr
    direction: min
  opm_pct:
    column: operating_profit_margin_pct
    direction: min
  pe_ratio:
    column: pe_ratio
    direction: max
  pb_ratio:
    column: pb_ratio
    direction: max
  dividend_yield_pct:
    column: dividend_yield_pct
    direction: min
  dividend_payout_ratio_pct:
    column: dividend_payout_ratio_pct
    direction: max
  icr:
    column: icr
    direction: min
    debt_free_passes: true
  market_cap_cr:
    column: market_cap_cr
    direction: min
  net_profit_cr:
    column: net_profit
    direction: min
  sales_cr:
    column: sales
    direction: min
  asset_turnover:
    column: asset_turnover
    direction: min
  cfo_pat_ratio:
    column: cfo_pat_ratio
    direction: min
  de_yoy_declining:
    column: de_yoy_declining
    direction: flag
