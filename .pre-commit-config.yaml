# =============================================================================
# Nifty 100 Financial Intelligence Platform - Pre-commit Hooks
# Install hooks once: pre-commit install
# Run manually on all files: pre-commit run --all-files
# =============================================================================

repos:
  # ---- Remove trailing whitespace, fix end-of-file, check YAML/TOML ----
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=5000"]
      - id: detect-private-key
      - id: debug-statements
      - id: name-tests-test
        args: ["--pytest-test-first"]

  # ---- Black - deterministic Python formatter ----
  - repo: https://github.com/psf/black
    rev: 24.1.1
    hooks:
      - id: black
        language_version: python3.12
        args: ["--line-length=100"]

  # ---- Ruff - fast linter + auto-fixer ----
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.2.2
    hooks:
      - id: ruff
        args: ["--fix", "--line-length=100"]

  # ---- isort (fallback import sorting, redundant if ruff I is enabled) ----
  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: ["--profile=black", "--line-length=100"]
